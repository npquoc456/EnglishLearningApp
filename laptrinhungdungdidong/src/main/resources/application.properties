spring.application.name=demo

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/EnglishLearning?sslMode=DISABLED&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

# Validate schema by default. Only use 'update' for an intentional first-time migration.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

server.port=8080
server.address=0.0.0.0
